# Crate Digger MPC skin layout: the Force Shadow page (addon/shadow_page.conf),
# same MPC60-inspired td3 theme and coordinates, rebuilt as a native MPC plugin
# skin by shadow_skin.py (mpc-vst-plugins). Differences from the shadow page:
#   - no MIX TRIM / CHANNEL / OUTPUT ON / SKIPBACK: the plugin is a real MPC track
#     (mix, route and record it in MPC itself)
#   - TRANSPORT readouts: NOW PLAYING / STATUS / TIME
#   - RESULTS: 8 rows (2 x 4) with a page stepper instead of a scrolling list
style=td3
theme_bg=211d17
theme_panel=c7c2b0
theme_line=8f8a78
theme_ink=2b2822
theme_ink_dim=6b6558
theme_ink_faint=9a9484
theme_accent=2b2822
theme_accent_hi=2b2822
theme_knob_face=e9e4d3
theme_knob_ring=3a352c
theme_bar=c7c2b0
theme_seg_active=2f4a6b
theme_seg_inactive=b3ae9c
theme_seg_active_tx=e9e4d3
theme_btn_text=e9e4d3
theme_tab_on=2f4a6b
theme_tab_on_tx=e9e4d3
theme_lcd=c7c2b0
theme_box=c7c2b0
theme_btn_bg=b8382b
theme_chrome_ink=2b2822
theme_knob_dot=2f4a6b
knob_look=bakelite

theme_display_bg=ededed
theme_display_cell=e1e0e0
theme_display_ink=525252
theme_display_off=b5b5b5
theme_display_bezel=6b6b6b
art_css=skin.css
[tab PLAY]
art file=images/chassis_play.svg x=0 y=0 w=1280 h=800
frame x=40 y=88 w=1200 h=220 title="TRANSPORT"
button cx=172 cy=169 label="◄◄" key=rewind_15 color=8f8a78
button cx=272 cy=169 label="▶ ❚❚" key=play_pause color=db4939
button cx=372 cy=169 label="►►" key=forward_15 color=8f8a78
button cx=472 cy=169 label="■" key=stop color=393939
button cx=700 cy=169 label="" key=transport_sync img=images/sync_off.png img_on=images/sync_on.png
readout w=822 h=38 cx=471 cy=256 label="NOW PLAYING" key=now_playing style=dotmatrix
readout w=170 h=38 cx=1000 cy=169 label="STATUS" key=status label_align=center
readout w=130 h=40 cx=994 cy=256 label="TIME" key=time style=dotmatrix
button cx=1120 cy=413 label="SEARCH" key=search color=2f4a6b

frame x=40 y=320 w=1200 h=140 title="RESULTS"
slider_v cx=1165 cy=201 w=110 h=146 label="" key=gain base=images/fader_base.png img=images/fader_cap.png ns=0 bw=110
stepper w=520 h=52 cx=322 cy=411 label="RESULTS PAGE" key=page label_align=center
readout w=410 h=38 cx=817 cy=413 label="SEARCH" key=search_status label_align=center

frame x=40 y=470 w=1200 h=240 title="RESULTS"
list x=64 y=512 w=1152 h=188 key=result cols=2 rows=4 th=44 gap=4

qlinks "PLAY" = rewind_15,play_pause,forward_15,stop,transport_sync,gain,page,search
[tab FILTERS]
art file=images/chassis_filters.svg x=0 y=0 w=1280 h=800
frame x=40 y=88 w=1202 h=540 title="DISCOGS FILTERS"
stepper w=1000 h=64 cx=640 cy=183 label="GENRE" key=genre label_align=center
stepper w=1000 h=64 cx=640 cy=283 label="STYLE (DEPENDS ON GENRE)" key=style label_align=center
stepper w=1000 h=64 cx=640 cy=383 label="DECADE" key=decade label_align=center
stepper w=1000 h=64 cx=640 cy=483 label="REGION" key=region label_align=center
stepper w=1000 h=64 cx=640 cy=583 label="COUNTRY (DEPENDS ON REGION)" key=country label_align=center
button cx=282 cy=676 label="SEARCH DISCOGS" key=search color=2f4a6b
readout w=748 h=38 cx=820 cy=676 label="STATUS" key=search_status label_align=center
qlinks "FILTERS" = genre,style,decade,region,country,search
