# Build Crate Digger into a DRAFT release (cratedigger-vst-v<version>) with mpc-vst-plugins' shared
# workflow: Actions -> "VST release (draft)" -> Run workflow. Then install that draft's zip on a
# device, smoke-test it, and publish the draft (see mpc-vst-plugins docs/RELEASING.md).
# dry_run builds the zip and skin previews as run artifacts only.
name: VST release (draft)

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version, e.g. 1.0.1
        required: true
      dry_run:
        description: Build only (zip + skin previews as run artifacts), no draft release
        type: boolean
        default: false

jobs:
  crate-digger:
    uses: sd88me/mpc-vst-plugins/.github/workflows/vst-release.yml@ccfac7dd09057f2be6735acdde9ee3abd1c25394
    permissions:
      contents: write
    with:
      tag: cratedigger-vst-v${{ inputs.version }}
      version: ${{ inputs.version }}
      tools_ref: ccfac7dd09057f2be6735acdde9ee3abd1c25394
      vst_dir: vst
      build: SHADOW_SKIN_MPC_OS=2 TARGETS="armv7 aarch64" bash vst/release_build.sh
      extra: vst/build/engine/bin:cratedigger/bin
      extra_aarch64: vst/build/aarch64/engine/bin:cratedigger/bin
      zig: 0.14.1
      plugin_id: crate-digger
      license: MIT
      requires: A network connection (streams from Discogs and the web)
      about: Dig for records by genre, style, decade and country on Discogs, then stream and play them into your MPC track. Needs a network connection.
      dry_run: ${{ inputs.dry_run }}
